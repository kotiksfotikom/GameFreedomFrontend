<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>GameFreedom Каталог</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav id="navbar"></nav>
    <h1>Каталог ігор</h1>
    <div id="games-container">Завантаження даних</div>

    <script src="auth.js"></script>
    <script>
        renderNavbar();

        fetch(`${API_URL}/api/games/`)
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('games-container');
                container.innerHTML = '';

                if (data.length === 0) {
                    container.innerHTML = '<p>Ігор поки немає. Додайте їх через API або сторінку "Додати гру".</p>';
                    return;
                }

                data.forEach(game => {
                    container.innerHTML += `
                        <div class="game-card">
                            <h2>${game.title}</h2>
                            <p class="price">$${game.price}</p>
                            <p>${game.description || 'Опису поки немає'}</p>
                        </div>
                    `;
                });
            })
            .catch(error => {
                document.getElementById('games-container').innerHTML =
                    '<p class="error">Помилка завантаження даних з API</p>';
            });
    </script>
</body>
</html>
